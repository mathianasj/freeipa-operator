apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "freeipa.mathianasj.io/v1alpha1",
          "kind": "FreeIPA",
          "metadata": {
            "name": "freeipa-sample"
          },
          "spec": {
            "resources": {
              "limits": {
                "cpu": "4",
                "memory": "8Gi"
              },
              "requests": {
                "cpu": "2",
                "memory": "4Gi"
              }
            },
            "volumeClaimTemplate": {
              "accessModes": [
                "ReadWriteOnce"
              ],
              "resources": {
                "requests": {
                  "storage": "10Gi"
                }
              }
            }
          }
        }
      ]
    capabilities: Full Lifecycle
    categories: Security
    containerImage: quay.io/mathianasj/freeipa-operator:0.1.0
    createdAt: "2026-08-11T01:02:13Z"
    description: Deploys and manages the lifecycle of FreeIPA servers on OpenShift.
    olm.skipRange: '>=0.1.0 <0.2.0'
    operators.operatorframework.io/builder: operator-sdk-v1.39.2
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
    repository: https://github.com/mathianasj/freeipa-operator
    support: mathianasj
  name: freeipa-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: FreeIPA is the Schema for the freeipas API.
      displayName: Free IPA
      kind: FreeIPA
      name: freeipas.freeipa.mathianasj.io
      version: v1alpha1
  description: |
    The FreeIPA Operator deploys and manages the lifecycle of FreeIPA (Identity,
    Policy, and Audit) servers on Red Hat OpenShift.

    ## Features
    - Deploys a single-node FreeIPA master as a StatefulSet with persistent storage
    - Exposes DNS, Kerberos, kpasswd, LDAP/LDAPS and kadmin endpoints through a
      LoadBalancer service (requires MetalLB Operator on bare-metal, or a cloud
      load balancer provider)
    - Exposes the web UI through a passthrough Route
    - Generates and manages the FreeIPA administrator and directory manager passwords
    - Creates the SecurityContextConstraints required by the systemd-based workload

    ## Usage
    Create a FreeIPA resource in a namespace. When volumeClaimTemplate is omitted the
    instance uses ephemeral storage; for production set a volumeClaimTemplate.
