name: Build and Push Images

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]

env:
  IMAGE_TAG_BASE: quay.io/mathianasj/freeipa-operator
  PLATFORMS: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Determine image tag
        id: determine-tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF#v}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF#refs/heads/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push controller
        run: |
          make docker-buildx \
            IMG=${{ env.IMAGE_TAG_BASE }}:${{ steps.determine-tag.outputs.tag }}

      - name: Build and push bundle
        run: |
          make bundle \
            IMG=${{ env.IMAGE_TAG_BASE }}:${{ steps.determine-tag.outputs.tag }}

      - name: Ensure SCC permissions in CSV
        run: |
          if ! grep -q 'security.openshift.io' bundle/manifests/freeipa-operator.clusterserviceversion.yaml; then
            yq -i '
              .spec.install.spec.clusterPermissions += [{
                "rules": [{
                  "apiGroups": ["security.openshift.io"],
                  "resources": ["securitycontextconstraints"],
                  "verbs": ["get", "list", "watch", "create", "update", "patch", "delete"]
                }]
              }]
            ' bundle/manifests/freeipa-operator.clusterserviceversion.yaml
          fi

      - name: Build and push bundle image
        run: |
          make bundle-build \
            BUNDLE_IMG=${{ env.IMAGE_TAG_BASE }}-bundle:${{ steps.determine-tag.outputs.tag }}
          make bundle-push \
            BUNDLE_IMG=${{ env.IMAGE_TAG_BASE }}-bundle:${{ steps.determine-tag.outputs.tag }}

      - name: Build and push catalog
        run: |
          make catalog-build \
            CATALOG_IMG=${{ env.IMAGE_TAG_BASE }}-catalog:${{ steps.determine-tag.outputs.tag }} \
            BUNDLE_IMGS=${{ env.IMAGE_TAG_BASE }}-bundle:${{ steps.determine-tag.outputs.tag }}
          make catalog-push \
            CATALOG_IMG=${{ env.IMAGE_TAG_BASE }}-catalog:${{ steps.determine-tag.outputs.tag }}
